name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, bcmath, gd, zip, intl
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências Node
        run: npm ci

      # Necessário mesmo em teste: app.blade.php usa @vite(...), e qualquer teste que
      # renderize uma página Inertia (Home, Login, Workflows, editor, ...) recebe 500
      # (ViteManifestNotFoundException) sem public/build/manifest.json existir.
      - name: Build dos assets (Vite)
        run: npm run build

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Testes rodam em SQLite em memória (ver phpunit.xml) — não depende do MySQL do
      # docker-compose.yml, que é só para dev local.
      - name: Rodar testes
        run: php artisan test
