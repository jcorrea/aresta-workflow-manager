<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .accent-line { fill: #00FF66; }
      .brand-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 24px; letter-spacing: -0.03em; }
    </style>
  </defs>

  <!-- ISOTIPO (3 linhas paralelas na lateral esquerda, progresso linear) -->
  <g transform="translate(5, 6)">
    <rect x="0" y="0" width="14" height="3.5" class="accent-line" rx="1" />
    <rect x="0" y="10.5" width="28" height="3.5" class="accent-line" rx="1" />
    <rect x="0" y="21" width="42" height="3.5" class="accent-line" rx="1" />
  </g>

  <!-- LOGOTIPO (Wordmark) -->
  <text x="64" y="28" class="brand-text">aresta</text>
</svg>
