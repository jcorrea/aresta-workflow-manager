name: aresta-workflow-manager

services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Containerfile
    container_name: aresta-workflow-app
    working_dir: /app
    volumes:
      - .:/app:Z
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      # Teste de integração com giits-propostas: aponta pro mesmo sqlite usado fora do
      # compose (bin/artisan), onde está o workflow real "Processo de propostas" — o mysql
      # abaixo tem só dados de demonstração divergentes. Reverter pra mysql quando as duas
      # bases forem unificadas de novo.
      DB_CONNECTION: sqlite
      # Ollama roda como serviço deste compose (ver `ollama` abaixo) — alcançado pelo nome do
      # serviço na rede interna, mesmo padrão do DB_HOST acima.
      OLLAMA_URL: http://ollama:11434
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - aresta-workflow

  # IA local (opcional) pra geração de rascunho de workflow — ver AiWorkflowDraftGenerator.
  # Sobe vazio; rodar `docker compose exec ollama ollama pull llama3.2:1b` (ou o modelo
  # escolhido em OLLAMA_MODEL) depois do primeiro `docker compose up`.
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: aresta-workflow-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - aresta-workflow-ollama-data:/root/.ollama
    networks:
      - aresta-workflow

  mysql:
    image: mysql:8.0
    container_name: aresta-workflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aresta_workflow}
      MYSQL_USER: ${DB_USERNAME:-aresta_workflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aresta_workflow}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - aresta-workflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aresta-workflow

  # --- Análise estática/de vulnerabilidades (SonarQube) ---
  # O servidor SonarQube roda centralizado numa VM compartilhada entre projetos, não aqui.
  # Este serviço só faz o scan e envia o relatório pra lá; sobe sob demanda, não com
  # `docker compose up`:
  # SONAR_HOST_URL=http://<ip-da-vm>:9000 SONAR_TOKEN=<token> docker compose run --rm sonar-scanner
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: aresta-workflow-sonar-scanner
    profiles: ["scan"]
    working_dir: /usr/src
    volumes:
      - .:/usr/src:Z
    environment:
      SONAR_HOST_URL: ${SONAR_HOST_URL:-}
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    networks:
      - aresta-workflow

volumes:
  aresta-workflow-mysql-data:
  aresta-workflow-ollama-data:

networks:
  aresta-workflow:
    driver: bridge
